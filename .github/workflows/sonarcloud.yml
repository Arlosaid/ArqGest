name: SonarCloud Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para análisis de PRs y mejor relevancia

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-django

      - name: Run tests with coverage
        run: |
          pytest --cov=arc_manager/apps --cov=arc_manager/core --cov-report=xml:coverage.xml --cov-report=term-missing -v
        env:
          SECRET_KEY: "test-secret-key-for-ci-sonarcloud-12345"
          DEBUG: "True"
          TESTING: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1,*"
          ENABLE_STORAGES: "false"
          DJANGO_SETTINGS_MODULE: "core.settings"
          PYTHONPATH: "arc_manager"

      - name: Debug coverage file
        run: |
          echo "=== Coverage file exists? ==="
          ls -la coverage.xml || echo "coverage.xml NOT FOUND"
          echo "=== Coverage file content (first 50 lines) ==="
          head -50 coverage.xml || echo "Cannot read coverage.xml"

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Necesario para decorar PRs
