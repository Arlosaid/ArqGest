services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arc_manager_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      # Optimizaciones de PostgreSQL
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    
    # Configuración de recursos
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    
    # Health check para PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
        compress: "true"
    
    # Optimización de PostgreSQL para desarrollo
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=512MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    
    # Optimizaciones de Redis
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      # Cache para acelerar builds
      cache_from:
        - python:3.11-slim
    
    # Script de inicio profesional - silencioso pero muestra errores
    command: >
      sh -c "
        echo 'Starting ArqGest...' &&
        until pg_isready -h db -p 5432 -U ${POSTGRES_USER:-postgres} > /dev/null 2>&1; do
          sleep 2
        done &&
        python manage.py migrate --noinput --verbosity=0 &&
        python manage.py createcachetable > /dev/null 2>&1 || true &&
        python manage.py collectstatic --noinput --clear --verbosity=0 &&
        echo 'Server ready on http://localhost:8000' &&
        python manage.py runserver 0.0.0.0:8000
      "
    
    volumes:
      # Solo código necesario en desarrollo
      - ./arc_manager:/app/arc_manager:cached
      - ./tests:/app/tests:cached
      - ./pytest.ini:/app/pytest.ini:cached
      - ./.coveragerc:/app/.coveragerc:cached
      - static_volume:/app/arc_manager/staticfiles
      - media_volume:/app/arc_manager/media
      - temp_uploads:/app/temp_uploads
      # Excluir archivos innecesarios para mejor performance
      - /app/arc_manager/__pycache__
      - /app/arc_manager/**/__pycache__
      - /app/arc_manager/logs
      - /app/arc_manager/staticfiles/admin
      - /app/tests/__pycache__
      - /app/tests/**/__pycache__
    
    ports:
      - "${WEB_PORT:-8000}:8000"
    
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    
    environment:
      # Core Django
      - DOCKER_CONTAINER=true
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@db:5432/${POSTGRES_DB:-arc_manager_dev}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      
      # Redis cache
      - REDIS_URL=redis://redis:6379/0
      - CACHE_BACKEND=redis
      
      # Storage
      - ENABLE_STORAGES=${ENABLE_STORAGES:-false}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-1500}
      - ENABLE_SINGLE_FILE_UPLOAD=${ENABLE_SINGLE_FILE_UPLOAD:-true}
      
      # Upload optimizations
      - DATA_UPLOAD_MAX_MEMORY_SIZE=${DATA_UPLOAD_MAX_MEMORY_SIZE:-26214400}
      - DATA_UPLOAD_MAX_NUMBER_SIZE=${DATA_UPLOAD_MAX_NUMBER_SIZE:-1610612736}
      - FILE_UPLOAD_TEMP_DIR=/app/temp_uploads
      
      # File types
      - ALLOWED_EXTENSIONS=${ALLOWED_EXTENSIONS:-PDF,JPG,JPEG,PNG,GIF,DWG,DXF,RVT,SKP,3DS,MAX,ZIP,RAR,7Z,TIFF,DOC,DOCX,XLS,XLSX,PPT,PPTX,TXT,MD}
      
      # Rate limiting
      - FILE_UPLOAD_RATE_LIMIT_MINUTE=${FILE_UPLOAD_RATE_LIMIT_MINUTE:-15}
      - FILE_UPLOAD_RATE_LIMIT_HOUR=${FILE_UPLOAD_RATE_LIMIT_HOUR:-200}
      - FILE_UPLOAD_SIZE_LIMIT_HOUR_MB=${FILE_UPLOAD_SIZE_LIMIT_HOUR_MB:-5000}
      
      # S3/R2 configuration
      - AWS_S3_MULTIPART_THRESHOLD=${AWS_S3_MULTIPART_THRESHOLD:-26214400}
      - AWS_S3_MULTIPART_CHUNKSIZE=${AWS_S3_MULTIPART_CHUNKSIZE:-52428800}
      - AWS_S3_MAX_CONCURRENCY=${AWS_S3_MAX_CONCURRENCY:-15}
      - AWS_S3_CONNECT_TIMEOUT=${AWS_S3_CONNECT_TIMEOUT:-120}
      - AWS_S3_READ_TIMEOUT=${AWS_S3_READ_TIMEOUT:-1800}
      - AWS_S3_MAX_POOL_CONNECTIONS=${AWS_S3_MAX_POOL_CONNECTIONS:-50}
      - AWS_S3_RETRY_ATTEMPTS=${AWS_S3_RETRY_ATTEMPTS:-5}
      - PRESIGN_EXPIRES_SECONDS=${PRESIGN_EXPIRES_SECONDS:-7200}
      - MAX_CHECKSUM_MB=${MAX_CHECKSUM_MB:-50}
      
      # Python optimizations
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      
      # Logging configuration - Solo errores críticos
      - LOG_REQUESTS=true
      - LOG_ONLY_ERRORS=true
      - LOG_SLOW_REQUESTS=false
      - SAMPLE_RATE=0
      - SLOW_REQUEST_THRESHOLD=5000
      
      # Email (Resend)
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-ArqGest <noreply@arqgest.com>}
      - REPLY_TO_EMAIL=${REPLY_TO_EMAIL:-}
      
      # Site info
      - SITE_NAME=${SITE_NAME:-ArqGest}
      - SITE_DOMAIN=${SITE_DOMAIN:-localhost:8000}
      - SITE_URL=${SITE_URL:-http://localhost:8000}
      
      # Session validation deshabilitada por defecto (permite múltiples dispositivos)
      # - SESSION_VALIDATE_USER_AGENT=false  # Ya es false por defecto en settings.py
    
    restart: unless-stopped

  cron:
    build:
      context: .
      dockerfile: Dockerfile.cron
    
    volumes:
      - ./arc_manager:/app/arc_manager:cached
      - ./scripts:/app/scripts:ro
      - ./logs:/app/logs
    
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"
    
    environment:
      # Core Django
      - DOCKER_CONTAINER=true
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@db:5432/${POSTGRES_DB:-arc_manager_dev}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      
      # Redis cache
      - REDIS_URL=redis://redis:6379/0
      
      # Email (Resend)
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-noreply@localhost}
      - REPLY_TO_EMAIL=${REPLY_TO_EMAIL:-}
      
      # Site info
      - SITE_NAME=${SITE_NAME:-ArqGest}
      - SITE_DOMAIN=${SITE_DOMAIN:-localhost:8000}
      - SITE_URL=${SITE_URL:-http://localhost:8000}
      
      # Python optimizations
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      
      # Logging
      - LOG_REQUESTS=true
      - LOG_ONLY_ERRORS=true
      - LOG_SLOW_REQUESTS=false
      - SAMPLE_RATE=0
    
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  temp_uploads:
    driver: local

# Network opcional para mejor aislamiento
networks:
  default:
    driver: bridge