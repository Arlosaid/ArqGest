<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicio Temporalmente No Disponible - ArqGest</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f9fa;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .error-container {
            text-align: center;
            max-width: 500px;
            padding: 2rem;
        }
        
        .error-code {
            font-size: 4rem;
            font-weight: 300;
            color: #ffc107;
            margin-bottom: 1rem;
            line-height: 1;
        }
        
        .error-title {
            font-size: 1.5rem;
            color: #495057;
            margin-bottom: 1rem;
            font-weight: 500;
        }
        
        .error-message {
            color: #6c757d;
            margin-bottom: 1.5rem;
            font-size: 1rem;
        }
        
        .error-details {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 0.375rem;
            padding: 1rem;
            margin-bottom: 2rem;
            font-size: 0.875rem;
            color: #856404;
        }
        
        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 0.375rem;
            font-weight: 500;
            transition: background-color 0.15s ease;
            margin: 0.25rem;
        }
        
        .btn:hover {
            background: #0056b3;
            color: white;
            text-decoration: none;
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .btn-secondary:hover {
            background: #545b62;
        }
        
        .loading-dots {
            display: inline-block;
            margin-left: 0.5rem;
        }
        
        .loading-dots span {
            animation: blink 1.4s infinite both;
            display: inline-block;
        }
        
        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes blink {
            0%, 80%, 100% { opacity: 0; }
            40% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">502</div>
        <h1 class="error-title">Servicio temporalmente no disponible</h1>
        <p class="error-message">
            El servidor está iniciando o actualizándose. Por favor, espera unos momentos.
        </p>
        <div class="error-details">
            <strong>¿Qué está pasando?</strong><br>
            El servicio está iniciando o se está conectando a la base de datos. 
            Esto suele tomar solo unos segundos.
            <div class="loading-dots">
                <span>.</span><span>.</span><span>.</span>
            </div>
        </div>
        <a href="javascript:location.reload()" class="btn">Reintentar ahora</a>
        <a href="/" class="btn btn-secondary">Ir al inicio</a>
    </div>
    
    <script>
        // Auto-reload después de 10 segundos
        setTimeout(function() {
            location.reload();
        }, 10000);
    </script>
</body>
</html>
