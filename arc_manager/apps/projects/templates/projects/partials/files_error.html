{% load i18n %}

<!-- Template de error para archivos -->
<div class="alert alert-danger text-center py-4">
    <i class="fas fa-exclamation-triangle fa-2x mb-3"></i>
    <h5>{% trans "Error al cargar archivos" %}</h5>
    <p class="mb-3">{{ error|default:"Ocurrió un error inesperado. Por favor intenta de nuevo." }}</p>
    <button class="btn btn-outline-danger" 
            onclick="location.reload()">
        <i class="fas fa-redo me-1"></i>
        {% trans "Reintentar" %}
    </button>
</div>
