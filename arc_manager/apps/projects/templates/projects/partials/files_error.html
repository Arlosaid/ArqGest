{% load i18n %}

<div class="files-empty-state" style="background: var(--files-danger-light, #fee2e2); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 0.75rem;">
    <i class="fas fa-exclamation-triangle files-empty-icon" style="color: var(--files-danger, #ef4444);"></i>
    <h6 class="files-empty-title" style="color: var(--files-danger, #ef4444);">{% trans "Error al cargar archivos" %}</h6>
    <p class="files-empty-text">{{ error|default:"Ocurrió un error inesperado. Por favor intenta de nuevo." }}</p>
    <button class="load-more-btn" 
            onclick="location.reload()"
            style="border-color: var(--files-danger, #ef4444); color: var(--files-danger, #ef4444);">
        <i class="fas fa-redo"></i>
        {% trans "Reintentar" %}
    </button>
</div>
