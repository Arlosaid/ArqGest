{% load i18n %}

<!-- Template de error para archivos HTMX -->
<div class="alert alert-danger text-center py-4" role="alert">
    <i class="fas fa-exclamation-triangle fa-2x mb-3 text-danger"></i>
    <h5 class="alert-heading">{% trans "Error al cargar archivos" %}</h5>
    <p class="mb-0">{{ error_message|default:"Ha ocurrido un error inesperado. Por favor intenta de nuevo." }}</p>
    <hr>
    <button class="btn btn-outline-danger btn-sm" onclick="location.reload()">
        <i class="fas fa-redo me-1"></i>
        {% trans "Recargar página" %}
    </button>
</div>
