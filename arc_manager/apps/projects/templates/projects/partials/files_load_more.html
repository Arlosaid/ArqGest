{% load i18n %}

<!-- Solo los nuevos elementos de archivos -->
{% include 'projects/partials/files_items.html' with files=files has_existing_files=True %}

<!-- Nuevo botón "Ver más" si hay más páginas -->
{% if has_more %}
<div class="text-center mt-3" id="load-more-container-{{ phase.id }}">
    <button class="btn btn-outline-primary" 
            hx-get="{% url 'projects:phase-files-paginated' project_id=phase.project.id phase_id=phase.id %}?page={{ next_page }}&load_more=true{% if current_filters.type %}&type={{ current_filters.type }}{% endif %}{% if current_filters.date %}&date={{ current_filters.date }}{% endif %}"
            hx-target="#files-grid-{{ phase.id }}"
            hx-swap="beforeend"
            hx-on="htmx:afterRequest: document.getElementById('load-more-container-{{ phase.id }}').remove()">
        <i class="fas fa-plus me-1"></i>
        {% trans "Ver más archivos" %}
    </button>
</div>
{% endif %}
