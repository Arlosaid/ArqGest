{% load i18n %}
{% load humanize %}

{% for file in files %}
<div class="card mb-2" id="file-{{ file.id }}">
    <div class="card-body d-flex justify-content-between align-items-center">
        <div>
            <a href="{{ file.file.url }}" target="_blank">{{ file.file.name|truncatechars:40 }}</a>
            <small class="text-muted d-block">{{ file.size|filesizeformat }}</small>
        </div>
        <button class="btn btn-sm btn-outline-danger" 
                hx-post="{% url 'files:delete_file' file.id %}" 
                hx-target="#file-{{ file.id }}" 
                hx-swap="outerHTML" 
                hx-confirm="{% trans 'Are you sure you want to delete this file?' %}">
            <i class="fas fa-trash"></i>
        </button>
    </div>
</div>
{% empty %}
<p>{% trans "No files uploaded for this phase yet." %}</p>
{% endfor %}
