{% load i18n %}
{% load humanize %}

<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
    {% for file in files %}
    <div class="col" id="file-{{ file.id }}">
        <div class="card h-100">
            <a href="{{ file.file.url }}" target="_blank" class="text-decoration-none">
                {% if file.file.url|lower|slice:"-4:" in ".jpg,.jpeg,.png,.gif" %}
                    <img src="{{ file.file.url }}" class="card-img-top" alt="{{ file.file.name }}" style="object-fit: cover; height: 150px;">
                {% else %}
                    <div class="card-img-top d-flex align-items-center justify-content-center bg-light" style="height: 150px;">
                        <i class="fas fa-file-alt fa-3x text-secondary"></i>
                    </div>
                {% endif %}
            </a>
            <div class="card-body">
                <p class="card-text small" title="{{ file.file.name }}">{{ file.file.name|truncatechars:25 }}</p>
                <small class="text-muted">{{ file.size|filesizeformat }}</small>
            </div>
            <div class="card-footer text-end">
                <button class="btn btn-sm btn-outline-danger file-delete-btn" 
                        data-delete-url="{% url 'files:delete_file' file.id %}" 
                        data-file-id="{{ file.id }}"
                        type="button">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12">
        <p>{% trans "No files uploaded for this phase yet." %}</p>
    </div>
    {% endfor %}
</div>
