{% load i18n %}

<!-- Modal de Creación Rápida de Cliente -->
<div class="modal fade" id="quickClientModal" tabindex="-1" aria-labelledby="quickClientModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 12px; border: none; box-shadow: 0 10px 40px rgba(0,0,0,0.15);">
            <div class="modal-header" style="border-bottom: 1px solid #e2e8f0; padding: 1.5rem;">
                <h5 class="modal-title" id="quickClientModalLabel" style="font-weight: 700; color: #1e293b;">
                    <i class="fas fa-user-plus text-primary me-2"></i>{% trans "Crear Cliente Rápido" %}
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" style="padding: 1.5rem;">
                <div class="alert alert-info mb-3" style="background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%); border: 1px solid #7dd3fc; border-radius: 8px;">
                    <i class="fas fa-info-circle me-2"></i>
                    <small>{% trans "Crea un cliente de forma rápida. Solo el nombre es obligatorio." %}</small>
                </div>
                
                <form id="quickClientForm">
                    {% csrf_token %}
                    <input type="hidden" name="is_active" value="on">
                    <div class="mb-3">
                        <label for="quick_client_name" class="form-label" style="font-weight: 600; color: #475569;">
                            {% trans "Nombre del Cliente" %} <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="quick_client_name" name="name" 
                               placeholder="{% trans 'Ej: Empresa ABC S.A.' %}" required
                               style="border-radius: 8px; border: 1px solid #cbd5e1; padding: 0.75rem;">
                        <div class="invalid-feedback" id="quick_client_name_error"></div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="quick_client_email" class="form-label" style="font-weight: 600; color: #475569;">
                            {% trans "Correo Electrónico" %} <span class="text-muted">({% trans "opcional" %})</span>
                        </label>
                        <input type="email" class="form-control" id="quick_client_email" name="email" 
                               placeholder="contacto@empresa.com"
                               style="border-radius: 8px; border: 1px solid #cbd5e1; padding: 0.75rem;">
                    </div>
                    
                    <div class="mb-3">
                        <label for="quick_client_phone" class="form-label" style="font-weight: 600; color: #475569;">
                            {% trans "Teléfono" %} <span class="text-muted">({% trans "opcional" %})</span>
                        </label>
                        <input type="tel" class="form-control" id="quick_client_phone" name="phone_number" 
                               placeholder="+52 1 234 567 890"
                               style="border-radius: 8px; border: 1px solid #cbd5e1; padding: 0.75rem;">
                    </div>
                </form>
                
                <div id="quickClientError" class="alert alert-danger d-none" style="border-radius: 8px;">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <span id="quickClientErrorMessage"></span>
                </div>
            </div>
            <div class="modal-footer" style="border-top: 1px solid #e2e8f0; padding: 1.5rem;">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" style="border-radius: 8px; padding: 0.5rem 1.5rem;">
                    <i class="fas fa-times me-2"></i>{% trans "Cancelar" %}
                </button>
                <button type="button" class="btn btn-primary" id="saveQuickClient" style="border-radius: 8px; padding: 0.5rem 1.5rem; background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); border: none;">
                    <i class="fas fa-check me-2"></i>{% trans "Crear Cliente" %}
                </button>
            </div>
        </div>
    </div>
</div>
