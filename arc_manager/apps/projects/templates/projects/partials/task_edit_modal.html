{% load i18n %}

<form method="post" action="{% url 'projects:task-edit' task.pk %}" id="editTaskForm">
    {% csrf_token %}
    
    <div class="modal-body">
        <div class="mb-3">
            <label for="title" class="form-label">{% trans "Título" %} *</label>
            <input type="text" class="form-control" id="title" name="title" value="{{ task.title }}" required>
        </div>
        
        <div class="mb-3">
            <label for="description" class="form-label">{% trans "Descripción" %}</label>
            <textarea class="form-control" id="description" name="description" rows="3">{{ task.description }}</textarea>
        </div>
        
        <div class="row">
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="priority" class="form-label">{% trans "Prioridad" %}</label>
                    <select class="form-select" id="priority" name="priority">
                        <option value="LOW" {% if task.priority == 'LOW' %}selected{% endif %}>{% trans "Baja" %}</option>
                        <option value="MEDIUM" {% if task.priority == 'MEDIUM' %}selected{% endif %}>{% trans "Media" %}</option>
                        <option value="HIGH" {% if task.priority == 'HIGH' %}selected{% endif %}>{% trans "Alta" %}</option>
                    </select>
                </div>
            </div>
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="assigned_to" class="form-label">{% trans "Asignado a" %}</label>
                    <select class="form-select" id="assigned_to" name="assigned_to">
                        <option value="">{% trans "Sin asignar" %}</option>
                        {% for user in users %}
                            <option value="{{ user.id }}" {% if task.assigned_to == user %}selected{% endif %}>
                                {{ user.get_full_name|default:user.email }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="phase" class="form-label">{% trans "Fase" %}</label>
                    <select class="form-select" id="phase" name="phase">
                        {% for phase in phases %}
                            <option value="{{ phase.id }}" {% if task.phase == phase %}selected{% endif %}>
                                {{ phase.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="due_date" class="form-label">{% trans "Fecha de vencimiento" %}</label>
                    <input type="date" class="form-control" id="due_date" name="due_date" 
                           value="{% if task.due_date %}{{ task.due_date|date:'Y-m-d' }}{% endif %}">
                </div>
            </div>
        </div>
    </div>
    
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{% trans "Cancelar" %}</button>
        <button type="submit" class="btn btn-primary">{% trans "Guardar" %}</button>
    </div>
</form>

<script>
document.getElementById('editTaskForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    const submitBtn = this.querySelector('button[type="submit"]');
    const originalText = submitBtn.textContent;
    
    // Mostrar loading
    submitBtn.disabled = true;
    submitBtn.textContent = '{% trans "Guardando..." %}';
    
    fetch(this.action, {
        method: 'POST',
        body: formData,
        headers: {
            'X-Requested-With': 'XMLHttpRequest'
        }
    })
    .then(response => {
        if (response.ok) {
            // Cerrar modal
            const modal = bootstrap.Modal.getInstance(document.getElementById('taskUniversalModal'));
            if (modal) modal.hide();
            
            // Recargar la página para mostrar los cambios
            window.location.reload();
        } else {
            throw new Error('Error al guardar');
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Error al guardar la tarea. Inténtalo de nuevo.');
    })
    .finally(() => {
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
    });
});
</script>
