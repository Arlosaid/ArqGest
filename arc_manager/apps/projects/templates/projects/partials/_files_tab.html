<!-- templates/projects/partials/_files_tab.html -->
{% load i18n %}

<div class="card shadow mb-4">
    <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary">{% trans "Archivos del Proyecto" %}</h6>
    </div>
    <div class="card-body">
        {% if phases %}
        <div class="accordion" id="filesAccordion">
            {% for phase in phases %}
            <div class="accordion-item mb-3 file-phase-item">
                <h2 class="accordion-header" id="heading-{{ phase.id }}">
                    <button class="accordion-button file-phase-header collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse-{{ phase.id }}" aria-expanded="false" aria-controls="collapse-{{ phase.id }}">
                        <span class="file-phase-title d-flex align-items-center">
                            <i class="fas fa-layer-group me-2"></i>{{ phase.name }}
                        </span>
                        <span class="file-phase-meta ms-auto d-flex align-items-center gap-2">
                            <span class="badge bg-primary-soft text-primary">{{ phase.files.count }} {% trans "archivos" %}</span>
                        </span>
                    </button>
                </h2>
                <div id="collapse-{{ phase.id }}" class="accordion-collapse collapse{% if open_phase|default:'' == phase.id|stringformat:'s' %} show{% endif %}" aria-labelledby="heading-{{ phase.id }}" data-bs-parent="#filesAccordion">
                    <div class="accordion-body">
                        <form class="mb-3 file-upload-form" 
                              hx-post="{% url 'files:upload_file' project_id=project.pk phase_id=phase.pk %}"
                              hx-target="#files-list-{{ phase.id }}"
                              hx-swap="innerHTML"
                              hx-encoding="multipart/form-data"
                              enctype="multipart/form-data">
                            {% csrf_token %}
                            <div class="file-upload-wrapper">
                                <div class="file-input-container">
                                    <input type="file" name="files" class="file-input" id="file-input-{{ phase.id }}" multiple required accept=".pdf,.jpg,.jpeg,.png,.gif,.tiff,.dwg,.dxf,.rvt,.skp,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.rar,.txt,.md">
                                    <label for="file-input-{{ phase.id }}" class="file-input-label">
                                        <i class="fas fa-cloud-upload-alt me-2"></i>
                                        <span class="file-label-text">{% trans "Seleccionar archivos" %}</span>
                                    </label>
                                    <div class="selected-files" id="selected-files-{{ phase.id }}" style="display: none;">
                                        <span class="selected-count"></span>
                                        <span class="selected-names"></span>
                                    </div>
                                </div>
                                <button class="btn btn-primary upload-btn" type="submit" disabled onclick="console.log('Upload started - Optimized HTMX solution'); console.log('Target #files-list-{{ phase.id }} exists:', !!document.getElementById('files-list-{{ phase.id }}')); return true;">
                                    <i class="fas fa-upload"></i>
                                    <span class="ms-1">{% trans "Subir" %}</span>
                                </button>
                            </div>
                        </form>

                        <!-- Lista de archivos - contenido se carga dinámicamente -->
                        <div id="files-list-{{ phase.id }}">
                            {% include 'projects/partials/files_list_content.html' %}
                        </div> <!-- Cerrar files-list -->
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        {% else %}
            <div class="text-center text-muted">{% trans "Primero crea una fase para poder subir archivos." %}</div>
        {% endif %}
    </div>
</div>

<script>
console.log('🚀 Files tab script loaded!');
// Manejar selección de archivos y mostrar información
document.addEventListener('DOMContentLoaded', function() {
    console.log('✅ DOMContentLoaded fired in files tab!');
    document.querySelectorAll('.file-input').forEach(function(input) {
        input.addEventListener('change', function() {
            const phaseId = this.id.split('-').pop();
            const selectedFilesDiv = document.getElementById('selected-files-' + phaseId);
            const selectedCount = selectedFilesDiv.querySelector('.selected-count');
            const selectedNames = selectedFilesDiv.querySelector('.selected-names');
            const uploadBtn = this.closest('form').querySelector('.upload-btn');
            const fileLabel = this.closest('.file-input-container').querySelector('.file-label-text');
            
            if (this.files.length > 0) {
                // Mostrar información de archivos seleccionados
                selectedFilesDiv.style.display = 'block';
                selectedCount.textContent = this.files.length + (this.files.length === 1 ? ' archivo seleccionado' : ' archivos seleccionados');
                
                // Mostrar nombres de archivos (máximo 3, luego "y X más...")
                const fileNames = Array.from(this.files).slice(0, 3).map(file => file.name);
                if (this.files.length > 3) {
                    fileNames.push('y ' + (this.files.length - 3) + ' más...');
                }
                selectedNames.textContent = fileNames.join(', ');
                
                // Habilitar botón de subir
                uploadBtn.disabled = false;
                fileLabel.textContent = 'Cambiar archivos';
            } else {
                // Ocultar información y deshabilitar botón
                selectedFilesDiv.style.display = 'none';
                uploadBtn.disabled = true;
                fileLabel.textContent = 'Seleccionar archivos';
            }
        });
    });
});

// Trigger personalizado para recargar archivos después de subir
document.body.addEventListener('htmx:afterRequest', function(evt) {
    if (evt.detail.xhr.status === 200 && evt.detail.requestConfig.path.includes('/files/upload/')) {
        // Disparar evento personalizado para recargar archivos
        document.body.dispatchEvent(new CustomEvent('fileUploaded'));
        
        // Limpiar el formulario después de subir exitosamente
        const form = evt.target.closest('form');
        if (form && form.classList.contains('file-upload-form')) {
            form.reset();
            
            // Resetear estado de selección de archivos
            const fileInput = form.querySelector('.file-input');
            if (fileInput) {
                const phaseId = fileInput.id.split('-').pop();
                const selectedFilesDiv = document.getElementById('selected-files-' + phaseId);
                const uploadBtn = form.querySelector('.upload-btn');
                const fileLabel = form.querySelector('.file-label-text');
                
                selectedFilesDiv.style.display = 'none';
                uploadBtn.disabled = true;
                fileLabel.textContent = 'Seleccionar archivos';
            }
        }
    }
});

// Los errores de archivos ahora se manejan globalmente en htmx_error_handler.js
// No necesitamos listener específico para evitar duplicados

// Resetear formulario después de cualquier error (sin notificación duplicada)
document.body.addEventListener('htmx:responseError', function(evt) {
    if (evt.detail.requestConfig.path && evt.detail.requestConfig.path.includes('/files/upload/')) {
        // Solo resetear el formulario, la notificación la maneja htmx_error_handler.js
        const form = evt.target.closest('form');
        if (form && form.classList.contains('file-upload-form')) {
            form.reset();
        }
    }
});
</script>
