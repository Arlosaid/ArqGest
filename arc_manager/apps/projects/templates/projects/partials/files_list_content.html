{% load i18n %}
{% load humanize %}

<div class="files-filter-bar">
    <div class="filter-item">
        <i class="fas fa-filter"></i>
        <select class="filter-select" id="fileTypeFilter-{{ phase.id }}">
            <option value="">{% trans "Todos los tipos" %}</option>
            <option value="PDF">PDF</option>
            <option value="JPG,JPEG,PNG,GIF,TIFF">{% trans "Imágenes" %}</option>
            <option value="DWG,DXF,RVT,SKP">{% trans "Planos y Modelos" %}</option>
            <option value="DOC,DOCX,XLS,XLSX,PPT,PPTX">{% trans "Documentos Office" %}</option>
            <option value="ZIP,RAR">{% trans "Comprimidos" %}</option>
        </select>
    </div>
    
    <div class="filter-item">
        <i class="fas fa-calendar-alt"></i>
        <select class="filter-select" id="fileDateFilter-{{ phase.id }}">
            <option value="">{% trans "Cualquier fecha" %}</option>
            <option value="today">{% trans "Hoy" %}</option>
            <option value="week">{% trans "Esta semana" %}</option>
            <option value="month">{% trans "Este mes" %}</option>
        </select>
    </div>

    <div class="ms-auto d-none d-md-block">
        <span class="sort-indicator">
            <i class="fas fa-sort-amount-down"></i> {% trans "Más recientes primero" %}
        </span>
    </div>
</div>

<div id="files-container-{{ phase.id }}"
    hx-get="{% url 'projects:phase-files-paginated' project_id=phase.project.id phase_id=phase.id %}?offset=0&limit=18"
    hx-trigger="load, fileUploaded from:body" hx-swap="innerHTML">

    <div class="files-loading">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">{% trans "Cargando archivos..." %}</span>
        </div>
        <p>{% trans "Cargando documentos..." %}</p>
    </div>
</div>
