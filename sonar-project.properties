# Configuración de SonarCloud
sonar.projectKey=Arlosaid_ArqGest
sonar.organization=arlosaid

# Nombre del proyecto en SonarCloud
sonar.projectName=ArqGest

# Información del código fuente
sonar.sources=arc_manager
sonar.tests=tests

# Exclusiones (archivos que no se analizarán)
sonar.exclusions=**/migrations/**,**/static/**,**/staticfiles/**,**/media/**,**/templates/**,**/__pycache__/**,**/logs/**,**/*.min.js,**/*.min.css

# Cobertura de tests
sonar.python.coverage.reportPaths=coverage.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusiones de duplicados
sonar.cpd.exclusions=**/migrations/**,**/tests/**

# ========================================
# Ignorar falsos positivos específicos
# ========================================
# Regla S6418: Hardcoded secrets - El SECRET_KEY en settings.py solo se usa
# como fallback en desarrollo (DEBUG=True), en producción es obligatorio via env var
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S6418
sonar.issue.ignore.multicriteria.e1.resourceKey=**/settings.py
